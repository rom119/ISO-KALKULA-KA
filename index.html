<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expoziční kalkulačka</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:400px;
    margin:auto;
    background:#1e1e1e;
    padding:20px;
    border-radius:15px;
}

select{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border-radius:10px;
    border:none;
    background:#2d2d2d;
    color:white;
    font-size:16px;
}

.result{
    background:#2d2d2d;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-size:22px;
}
</style>
</head>

<body>

<div class="container">

<h1>Expoziční kalkulačka</h1>

<label>Clona</label>
<select id="aperture" onchange="calculate()">
    <option>1.4</option>
    <option>2</option>
    <option>2.8</option>
    <option selected>4</option>
    <option>5.6</option>
    <option>8</option>
    <option>11</option>
    <option>16</option>
</select>

<label>ISO</label>
<select id="iso" onchange="calculate()">
    <option selected>100</option>
    <option>200</option>
    <option>400</option>
    <option>800</option>
    <option>1600</option>
    <option>3200</option>
</select>

<label>Čas</label>
<select id="shutter" onchange="calculate()">
    <option>1/30</option>
    <option>1/60</option>
    <option selected>1/125</option>
    <option>1/250</option>
    <option>1/500</option>
    <option>1/1000</option>
</select>

<div class="result" id="result">
</div>

</div>

<script>
function calculate() {

    const aperture =
        document.getElementById("aperture").value;

    const iso =
        document.getElementById("iso").value;

    const shutter =
        document.getElementById("shutter").value;

    document.getElementById("result").innerHTML =
        "f/" + aperture +
        " • ISO " + iso +
        " • " + shutter + " s";
}

calculate();
</script>

</body>
</html>
