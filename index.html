<script>
function calculate() {

    const mode =
        document.getElementById("mode").value;

    const apertureSelect =
        document.getElementById("aperture");

    const isoSelect =
        document.getElementById("iso");

    const shutterSelect =
        document.getElementById("shutter");

    let aperture =
        parseFloat(apertureSelect.value);

    let iso =
        parseFloat(isoSelect.value);

    let shutter =
        1 / parseFloat(shutterSelect.value.split("/")[1]);

    // SUNNY 16

    if (mode === "shutter") {

        const calcShutter =
            (100 / iso) * Math.pow(aperture / 16, 2);

        shutter =
            "1/" + Math.round(1 / calcShutter);

        shutterSelect.value = shutter;

    }

    if (mode === "aperture") {

        const calcAperture =
            16 * Math.sqrt(shutter * iso / 100);

        apertureSelect.value =
            calcAperture.toFixed(1);

    }

    if (mode === "iso") {

        const calcIso =
            (100 * Math.pow(aperture / 16, 2)) / shutter;

        isoSelect.value =
            Math.round(calcIso);

    }

    document.getElementById("result").innerHTML =
        "Aktualizováno";
}

calculate();
</script>
