# Expoziční kalkulačka pro mobil

Ulož tento kód jako `index.html` a otevři ho v mobilu nebo nahraj na GitHub Pages / Netlify.

```html
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expoziční kalkulačka</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 420px;
    margin: auto;
    background: #1e1e1e;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
}
h1 {
    text-align: center;
}
label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
}
input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #2d2d2d;
    color: white;
    font-size: 16px;
}
button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #3b82f6;
    color: white;
    font-size: 18px;
    cursor: pointer;
}
.result {
    margin-top: 20px;
    padding: 15px;
    background: #2d2d2d;
    border-radius: 12px;
    text-align: center;
    font-size: 18px;
}
.small {
    font-size: 14px;
    opacity: 0.7;
}
</style>
</head>
<body>
<div class="container">
    <h1>Expoziční kalkulačka</h1>

    <label>Clona (f)</label>
    <select id="aperture" onchange="calculate()">
        <option>1.4</option>
        <option>2</option>
        <option>2.8</option>
        <option selected>4</option>
        <option>5.6</option>
        <option>8</option>
        <option>11</option>
        <option>16</option>
        <option>22</option>
    </select>

    <label>ISO</label>
    <select id="iso" onchange="calculate()">
        <option selected>100</option>
        <option>200</option>
        <option>400</option>
        <option>800</option>
        <option>1600</option>
        <option>3200</option>
        <option>6400</option>
    </select>

    <label>Expoziční čas</label>
    <select id="shutter" onchange="calculate()">
        <option>1/30</option>
        <option>1/60</option>
        <option selected>1/125</option>
        <option>1/250</option>
        <option>1/500</option>
        <option>1/1000</option>
        <option>1/2000</option>
    </select>

    <button onclick="calculate()">Spočítat</button>

    <div class="result" id="result">
</div>

<label>Režim výpočtu</label>
<select id="mode" onchange="calculate()">
    <option value="shutter">Spočítat čas</option>
    <option value="aperture">Spočítat clonu</option>
    <option value="iso">Spočítat ISO</option>
</select>
</div>

<script>
function calculate() {

    const aperture = parseFloat(document.getElementById("aperture").value);
    const iso = parseFloat(document.getElementById("iso").value);
    const shutterSelect = document.getElementById("shutter").value;
    const mode = document.getElementById("mode").value;

    const shutter = 1 / parseFloat(shutterSelect.split('/')[1]);

    let result = "";

    if (mode === "shutter") {

        const calcShutter = (100 / iso) * Math.pow(aperture / 16, 2);

        let shutterText;

        if (calcShutter >= 1) {
            shutterText = calcShutter.toFixed(1) + " s";
        } else {
            shutterText = "1/" + Math.round(1 / calcShutter) + " s";
        }

        result = "Čas: <strong>" + shutterText + "</strong>";

    } else if (mode === "aperture") {

        const calcAperture = 16 * Math.sqrt(shutter * iso / 100);

        result = "Clona: <strong>f/" + calcAperture.toFixed(1) + "</strong>";

    } else if (mode === "iso") {

        const calcIso = (100 * Math.pow(aperture / 16, 2)) / shutter;

        result = "ISO: <strong>" + Math.round(calcIso) + "</strong>";
    }

    document.getElementById("result").innerHTML = result;
}

calculate();
</script>
</body>
</html>
```

## Jak to použít

1. Zkopíruj kód.
2. Ulož jako `index.html`.
3. Otevři v mobilu.
4. Funguje i v tmavém režimu.
